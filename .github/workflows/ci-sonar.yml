name: CI with SonarCloud

on:
  push:
    branches: [ testing-exam ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout del codice
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      # Rendi eseguibili gli script bash
      - name: Make bash scripts executable
        run: |
          find tests/scripts/src/test/bash -name "*.sh" -exec chmod +x {} \;

      # Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Cache Maven locale repository
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Build + Test + JaCoCo + SonarCloud
      - name: Build, test and SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify sonar:sonar -Pjacoco-coverage \
            -Dsonar.projectKey=MatteoBasili_bookkeeper \
            -Dsonar.organization=matteobasili \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN
